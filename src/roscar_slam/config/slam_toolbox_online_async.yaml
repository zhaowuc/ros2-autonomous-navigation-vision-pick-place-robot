slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # Robustify pose-graph optimization against an occasional bad scan match.
    ceres_loss_function: HuberLoss

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_slam_filtered
    use_sim_time: false
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    # slam_toolbox explicitly requires an async scan queue of one.
    scan_queue_size: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    # Validated N10Plus near-wall returns start around 0.19 m.
    min_laser_range: 0.18
    max_laser_range: 10.0
    # The lidar publishes at 10 Hz; accept every scan.
    minimum_time_interval: 0.10
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    use_scan_matching: true
    # Link proximity uses sensor poses, not a centroid that shifts at doors.
    use_scan_barycenter: false
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 50
    # Separation between scan poses, not laser measurement range.
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # Conservative initial gates; field-test closures at distinctive corners.
    loop_search_maximum_distance: 1.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 20
    loop_match_maximum_variance_coarse: 0.5
    loop_match_minimum_response_coarse: 0.55
    loop_match_minimum_response_fine: 0.65

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 3.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Standard Karto hit/pass threshold; isolated erroneous hits should not
    # persist as occupied as long as under the previous 0.06 arena setting.
    min_pass_through: 2
    occupancy_threshold: 0.1
