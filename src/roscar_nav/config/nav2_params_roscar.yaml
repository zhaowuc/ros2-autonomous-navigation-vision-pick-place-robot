amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_filtered
    robot_model_type: nav2_amcl::OmniMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 10.0
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    # Never inject a hard-coded startup pose. The localization guard obtains a
    # scan-matched pose and AMCL publishes only after confidence is established.
    set_initial_pose: false
    initial_pose:
      x: -3.0
      y: -2.0
      z: 0.0
      yaw: 0.0
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.05
    update_min_d: 0.03

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /wheel/odom_raw
    bt_loop_duration: 10
    # Milliseconds. Leave enough margin for service/action discovery after a
    # Wi-Fi reconnection without making the navigation loop itself slower.
    default_server_timeout: 2000
    navigators: ['navigate_to_pose']
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_controller_selector_bt_node
      - nav2_navigate_to_pose_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /wheel/odom_raw
    # Thirty Hertz bounds the Cruise-to-Terminal command handoff below 100 ms
    # while remaining practical for the production MPPI workload.
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ['goal_checker']
    controller_plugins: ['FollowPathCruise', 'FollowPathTerminal']
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.01
      required_movement_angle: 0.02
      # Covers the base driver's bounded clear-fault/rearm cycle without
      # turning a temporary motor lock into a failed navigation action.
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Latch the XY phase once the 2 cm contract is reached. Re-checking XY
      # during final yaw correction causes alternating translation and rotation.
      stateful: true
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.05

    FollowPathCruise:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 48
      model_dt: 0.05
      batch_size: 1200
      vx_std: 0.10
      vy_std: 0.0
      wz_std: 0.20
      # MPPI's smoothed output was measured up to 1.5 mm/s above vx_max during
      # obstacle recovery.  Keep 3 mm/s of numerical headroom so the controller
      # topic itself remains inside the 0.20 m/s production contract; the Nav
      # command boundary still applies the independent hard clamp.
      vx_max: 0.197
      vx_min: 0.0
      vy_max: 0.0
      vy_min: 0.0
      wz_max: 0.45
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      critics: [ConstraintCritic, ObstaclesCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        cost_scaling_factor: 3.0
        inflation_radius: 0.60
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.30
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        # Overlap PathFollow's 0.50 m cutoff, including the 0.45 m soft waypoint.
        threshold_to_consider: 0.60
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.35
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.40
        offset_from_furthest: 8
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 6
        threshold_to_consider: 0.50
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.40
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.50

    FollowPathTerminal:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 48
      model_dt: 0.05
      batch_size: 1200
      vx_std: 0.05
      vy_std: 0.05
      wz_std: 0.10
      vx_max: 0.08
      vx_min: -0.06
      vy_max: 0.06
      vy_min: -0.06
      wz_max: 0.25
      iteration_count: 1
      prune_distance: 0.8
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: Omni
      visualize: false
      regenerate_noises: false
      critics: [ConstraintCritic, ObstaclesCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        cost_scaling_factor: 3.0
        inflation_radius: 0.60
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.30
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 18.0
        threshold_to_consider: 0.40
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.35
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.30
        offset_from_furthest: 4
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.30
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.30
        forward_preference: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[0.275, 0.270], [0.275, -0.270], [-0.275, -0.270], [-0.275, 0.270]]'
      # The mapped start point has 0.292 m measured wall clearance. Keep the
      # calibrated physical footprint unchanged and use a 1 cm software pad so
      # its proven occupied pose remains plannable.
      footprint_padding: 0.01
      plugins: ['static_layer', 'obstacle_layer', 'inflation_layer']
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan astra
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.12
          obstacle_max_range: 7.5
          raytrace_min_range: 0.12
          raytrace_max_range: 8.0
        astra:
          topic: /astra/depth/points_obstacles
          data_type: PointCloud2
          clearing: false
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.50
          obstacle_min_range: 0.55
          obstacle_max_range: 4.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.60
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.275, 0.270], [0.275, -0.270], [-0.275, -0.270], [-0.275, 0.270]]'
      footprint_padding: 0.01
      plugins: ['static_layer', 'obstacle_layer', 'inflation_layer']
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.12
          obstacle_max_range: 7.5
          raytrace_min_range: 0.12
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.60
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ['GridBased']
    GridBased:
      # The recorded home pose is physically valid but lies on the inflation
      # edge of the mapped wall. NavFn cannot seed the exact cell; 0.10 m lets
      # it select the nearest verified free cell (measured offset: 0.05 m).
      # The controller still enforces the saved final heading independently.
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ['simple_smoother']
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ['wait']
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.20, 0.06, 0.45]
    min_velocity: [-0.20, -0.06, -0.45]
    max_accel: [0.30, 0.20, 0.80]
    max_decel: [-0.45, -0.30, -1.00]
    odom_topic: /wheel/odom_raw
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.25

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.2
    source_timeout: 0.5
    # The deterministic simulation publishes the base pose at 50 Hz. Applying
    # an additional velocity-based frame shift moved arm self-returns into the
    # slowdown perimeter and halved every unobstructed speed profile.
    base_shift_correction: false
    # Keep an explicit zero command present throughout the bounded BT recovery
    # window; the Base Interface 0.15 s watchdog remains the second stop layer.
    stop_pub_timeout: 15.0
    # The simulated 360-degree laser sees a small part of the arm inside the
    # base footprint. Safety zones are therefore perimeter strips around the
    # frozen footprint, not filled polygons which would classify the robot's
    # own interior returns as obstacles. The physical footprint is 0.55 x
    # 0.54 m (half extents 0.275 x 0.270 m). Stop strips end exactly 0.05 m
    # outside that footprint. Outer strips remain published for RViz
    # inspection but are not velocity gates: the user's physical contract is
    # full navigation whenever every footprint edge has at least 0.05 m.
    polygons: ['StopFront', 'StopRear', 'StopLeft', 'StopRight', 'SlowFront', 'SlowRear', 'SlowLeft', 'SlowRight']
    StopFront:
      type: polygon
      points: [0.325, 0.320, 0.325, -0.320, 0.275, -0.320, 0.275, 0.320]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: collision_monitor/stop_front
      enabled: true
    StopRear:
      type: polygon
      points: [-0.275, 0.320, -0.275, -0.320, -0.325, -0.320, -0.325, 0.320]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: collision_monitor/stop_rear
      enabled: true
    StopLeft:
      type: polygon
      points: [0.325, 0.320, 0.325, 0.270, -0.325, 0.270, -0.325, 0.320]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: collision_monitor/stop_left
      enabled: true
    StopRight:
      type: polygon
      points: [0.325, -0.270, 0.325, -0.320, -0.325, -0.320, -0.325, -0.270]
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: collision_monitor/stop_right
      enabled: true
    SlowFront:
      type: polygon
      points: [0.425, 0.420, 0.425, -0.420, 0.325, -0.420, 0.325, 0.420]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.50
      visualize: true
      polygon_pub_topic: collision_monitor/slow_front
      enabled: false
    SlowRear:
      type: polygon
      points: [-0.325, 0.420, -0.325, -0.420, -0.425, -0.420, -0.425, 0.420]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.50
      visualize: true
      polygon_pub_topic: collision_monitor/slow_rear
      enabled: false
    SlowLeft:
      type: polygon
      points: [0.425, 0.420, 0.425, 0.320, -0.425, 0.320, -0.425, 0.420]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.50
      visualize: true
      polygon_pub_topic: collision_monitor/slow_left
      enabled: false
    SlowRight:
      type: polygon
      points: [0.425, -0.320, 0.425, -0.420, -0.425, -0.420, -0.425, -0.320]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.50
      visualize: true
      polygon_pub_topic: collision_monitor/slow_right
      enabled: false
    observation_sources: ['scan', 'astra']
    scan:
      type: scan
      topic: /scan_filtered
      enabled: true
    astra:
      type: pointcloud
      topic: /astra/depth/points_obstacles
      min_height: 0.05
      max_height: 1.50
      min_range: 0.55
      enabled: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
