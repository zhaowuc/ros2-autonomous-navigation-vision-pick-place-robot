n300pro_imu:
  ros__parameters:
    serial_port: /dev/n300_imu
    baud_rate: 115200
    frame_id: n300_imu_link

    # Keep N300Pro measurements separate from the C50C legacy onboard IMU.
    imu_topic: /imu/n300/data
    mag_topic: /imu/n300/mag
    temperature_topic: /imu/n300/temperature
    pressure_topic: /imu/n300/pressure
    rpy_topic: /imu/n300/rpy
    diagnostics_topic: /diagnostics

    expected_rate_hz: 100.0
    minimum_rate_hz: 90.0
    stale_timeout_sec: 0.5
    serial_reopen_timeout_sec: 2.0
    reconnect_delay_sec: 1.0

    # Conservative initial covariances. Replace them with values derived from a
    # stationary data set before enabling the corresponding EKF variables.
    orientation_stddev: 0.035
    angular_velocity_stddev: 0.003
    linear_acceleration_stddev: 0.05
    magnetic_field_stddev: 0.000005
    temperature_stddev: 1.0
    pressure_stddev: 2.0
